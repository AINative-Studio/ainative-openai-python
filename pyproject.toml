[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ainative-openai"
version = "0.1.0"
description = "Drop-in replacement for the OpenAI Python SDK — routes to AINative's free Llama, Qwen, DeepSeek & Kimi API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "AINative Studio", email = "dev@ainative.studio"},
]
keywords = [
    "openai",
    "openai-alternative",
    "free-llm-api",
    "openai-compatible",
    "llama-api",
    "deepseek-api",
    "qwen-api",
    "chat-completion",
    "ainative",
    "auto-provisioning",
    "free-tier",
    "tool-calling",
    "streaming",
    "embeddings",
    "claude",
    "cursor",
    "windsurf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/AINative-Studio/ainative-openai-python"
Documentation = "https://docs.ainative.studio"
Repository = "https://github.com/AINative-Studio/ainative-openai-python"
Issues = "https://github.com/AINative-Studio/ainative-openai-python/issues"

[tool.setuptools.packages.find]
include = ["ainative_openai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
